sonar.projectKey=imtarget05_MiniERP-Manufacturing-Warehouse
sonar.organization=imtarget05
sonar.projectName=MiniERP-Manufacturing-Warehouse

# Source code directories
sonar.sources=src
sonar.tests=tests

# Encoding
sonar.sourceEncoding=UTF-8

# Exclude generated and binary files
sonar.exclusions=**/bin/**,**/obj/**,**/*.json,**/migrations/**
sonar.test.exclusions=**/bin/**,**/obj/**

# Coverage report path (generated by dotnet test with coverlet)
sonar.cs.opencover.reportsPaths=**/TestResults/**/coverage.opencover.xml
