# ============================================================================
# PROJECT: MiniERP-Manufacturing-Warehouse (no numeric prefix)
# FILE:    docker-compose.yml
# PURPOSE: Full stack multi-container deployment: Oracle Database Free,
#          ASP.NET Core 8 Web API, and Nginx Factory Operations Dashboard.
#
# NOTE: `name:` pins the Compose project (Docker Desktop group header) so it
#       no longer derives from the folder name (e.g. `04-...`). Explicit
#       `image:` pins built images so they are also created without `04-`.
#       `oracle_data` reuses the existing volume from the old `04-...` project
#       (3.4G live DB) instead of creating an empty one, so no data migration
#       or hot-copy of running Oracle datafiles is needed.
# ============================================================================

name: minierp-manufacturing-warehouse

services:
  oracle-db:
    image: gvenzl/oracle-free:slim
    container_name: minierp-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PWD:-ErpPassword2026#}
      APP_USER: ${APP_USER:-erp_user}
      APP_USER_PASSWORD: ${APP_USER_PWD:-ErpPassword2026#}
      ORACLE_CHARACTERSET: AL32UTF8
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./sql:/sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 10s
      retries: 60
      start_period: 60s
    restart: unless-stopped
    networks:
      - default
      - portfolio-net

  api:
    build:
      context: ./src
      dockerfile: Dockerfile
    image: minierp-manufacturing-warehouse-api:latest
    container_name: minierp-api
    ports:
      - "5000:5000"
    environment:
      # Local demo default is Development so Swagger is served and a random
      # signing key is generated. A hardened deployment must set
      # ASPNETCORE_ENVIRONMENT=Production together with JWT_SIGNING_KEY
      # (>= 32 bytes) from a secret store - the API deliberately refuses to
      # start outside Development without it.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:-}
      ConnectionStrings__OracleDb: Data Source=oracle-db:1521/FREEPDB1;User Id=${APP_USER:-erp_user};Password=${APP_USER_PWD:-ErpPassword2026#};
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://localhost:5000,http://localhost:3000
    depends_on:
      oracle-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - default
      - portfolio-net

  ui:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    image: minierp-manufacturing-warehouse-ui:latest
    container_name: minierp-ui
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - default
      - portfolio-net

volumes:
  oracle_data:
    external: true
    name: 04-minierp-manufacturing-warehouse_oracle_data

networks:
  portfolio-net:
    external: true
    name: portfolio-net
