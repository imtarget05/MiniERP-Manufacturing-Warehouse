# Prometheus scrape config - minierp only.
# Apps run on the Docker host (or in their own compose stack); this stack
# only observes. host.docker.internal reaches them from inside the container.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: /metrics
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'minierp'
    metrics_path: /metrics
    # /metrics runs a live DB probe; under Oracle load it answers in seconds.
    # Global 10s timeout flaps the target, so this job gets its own budget.
    scrape_interval: 30s
    scrape_timeout: 25s
    static_configs:
      - targets: ['host.docker.internal:5000']
