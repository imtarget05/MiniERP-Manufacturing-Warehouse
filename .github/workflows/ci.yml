name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: 1. Build & Unit Tests
    runs-on: ubuntu-latest
    # This job has NO Oracle service - the runner image ships none, and starting
    # one here would turn the fast unit job into a slow one. That is fine,
    # because the tests it runs are exactly the ones that must not touch a
    # database: `--filter "Category!=Integration"`.
    #
    # It still has to GRANT a data source, because the test host is fail-closed
    # (tests/MiniERP.Api.Tests/TestOracleDsnGuard.cs): with no
    # ConnectionStrings__OracleDb in the environment, every guarded
    # WebApplicationFactory throws in its constructor instead of falling back to
    # src/appsettings.json. So the DSN below is set on purpose and points at a
    # CLOSED PORT (127.0.0.1:1, reserved, nothing listens there) with throwaway
    # `probe` credentials. That grants the host without granting a connection:
    # the no-database suite stays hermetic, a stray connection attempt fails
    # instantly instead of reaching a listener, and there is no way for this job
    # to write to anyone's Oracle. This is the same hermetic shape the W2 no-DB
    # evidence used, and the same one the guard's own failure message recommends.
    #
    # MINIERP_TEST_ALLOW_AMBIENT_DB is deliberately NOT set. It is the opt-in
    # that makes the guard accept src/appsettings.json (localhost:1521), and CI
    # must never rely on the repository's ambient configuration.
    env:
      ConnectionStrings__OracleDb: 'User Id=probe;Password=probe;Data Source=127.0.0.1:1/FREEPDB1;Pooling=true;Min Pool Size=1;'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore all dependencies (API + Tests)
        run: dotnet restore tests/MiniERP.Api.Tests/MiniERP.Api.Tests.csproj

      - name: Build API (Release, warnings as errors)
        run: dotnet build src/MiniERP.Api.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true -p:NuGetAudit=false

      - name: Run Unit & Contract Tests (no Oracle required)
        run: dotnet test tests/MiniERP.Api.Tests/MiniERP.Api.Tests.csproj -c Release --no-restore --filter "Category!=Integration" --logger "trx;LogFileName=unit-tests.trx" --collect:"XPlat Code Coverage" --results-directory ./test-results
        env:
          # Repeated on the step so the grant is visible where the tests are
          # actually invoked, and so a future edit to the job-level block cannot
          # silently un-authorise this command. Job-level env is inherited, so
          # these two must stay identical; the check at the end of the workflow
          # (ci-dsn-contract) fails the build if they ever drift.
          ConnectionStrings__OracleDb: 'User Id=probe;Password=probe;Data Source=127.0.0.1:1/FREEPDB1;Pooling=true;Min Pool Size=1;'

      # Coverage is measurable locally (cobertura.xml produced offline on
      # .NET 8, 2026-09-27) but the no-DB suite is NOT green locally (248/250
      # with the probe DSN: GuardedFactory_WithGrantedDsn and
      # SwaggerOperations_MatchTheEndpoints fail), so NO fail-under threshold
      # is set. Artifact only, for trend inspection.
      - name: Upload coverage report (artifact only, no threshold)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-cobertura
          path: tests/MiniERP.Api.Tests/TestResults/**/coverage.cobertura.xml
          if-no-files-found: warn

  # ---------------------------------------------------------------------------
  # ADDITIVE hardening (2026-09-27): dotnet format gate.
  # ADVISORY ONLY (continue-on-error: true, no `needs` link, never blocks).
  # Local verification: DIRTY — `dotnet format src/MiniERP.Api.csproj
  # --verify-no-changes` exits 2 with whitespace errors across src/Program.cs,
  # src/Services/ErpDbService.cs, ErpDbService.Helpdesk.cs, etc. Auto-fix is
  # out of scope for CI hardening, so this job reports only.
  # NOTE: there is no .sln at the repo root; the project path is required.
  # ---------------------------------------------------------------------------
  format-check:
    name: 0. Format check (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: dotnet format --verify-no-changes (advisory, see comment above)
        run: dotnet format src/MiniERP.Api.csproj --verify-no-changes --verbosity minimal

  full-acceptance-pipeline:
    name: 2. Full Acceptance Pipeline (Docker + Oracle + Integration Tests)
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    # No ConnectionStrings__OracleDb here on purpose, and that is the correct
    # design rather than an omission: this job has no database until the runner
    # creates one, so the workflow cannot know a valid DSN at this point, and a
    # placeholder written here would have to carry a password in the repository.
    # scripts/run-all-tests.sh therefore exports the DSN itself, naming the
    # disposable it just started (stage 5/9, function export_test_dsn) - built
    # from the same APP_USER / APP_USER_PWD / PDB handed to the container, with
    # the host port read back from the container. That is what authorises the
    # guarded test host for the integration tests, and it means the credential
    # lives only in the container definition, never in this file.
    # MINIERP_TEST_ALLOW_AMBIENT_DB is never set: it would authorise the
    # appsettings.json target instead of the disposable this job just created.
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Run Full Acceptance Pipeline (9 Stages)
        run: bash scripts/run-all-tests.sh

      - name: Archive Test & Execution Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-artifacts
          path: artifacts/
          retention-days: 7

  docker-build-verification:
    name: 3. Container Build Verification
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API Docker Image
        run: docker build -t minierp-api:ci-test -f src/Dockerfile src/

      - name: Build UI Docker Image
        run: docker build -t minierp-ui:ci-test -f dashboard/Dockerfile dashboard/

  # Both test jobs are fail-closed on the DSN, so a missing or wrong grant shows
  # up as a red build rather than as a test run that quietly inherited
  # src/appsettings.json. This job makes that contract checkable in one place
  # instead of leaving it to be discovered when CI goes red.
  ci-dsn-contract:
    name: 4. CI Test-Data-Source Contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Assert every dotnet test invocation is granted an explicit DSN
        run: bash scripts/check-ci-dsn-contract.sh

      # A destructive script that does not ask scripts/qa-gate.sh for a PROVEN
      # disposable identity is a script that can drop a production schema with
      # nothing but an acknowledgement in the environment. This job makes that
      # class of omission a red build: it discovers every destructive script
      # (scan, not a hardcoded list) and requires each to source qa-gate.sh,
      # call qa_gate before its first destructive statement, and capture the
      # target identity before lib.sh substitutes the production defaults. It
      # then drives restore-db.sh through an environment matrix with shimmed
      # docker/sqlplus/impdp and asserts 0 invocations on every refusal, so the
      # check is behavioural and not only a text property.
      - name: Assert every destructive script is gated by qa-gate.sh
        run: bash scripts/check-destructive-gate-contract.sh

      - name: Assert no script passes mktemp a non-trailing X template
        run: bash scripts/check-portable-mktemp.sh
