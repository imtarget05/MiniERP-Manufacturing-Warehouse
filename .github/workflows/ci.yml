name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-unit-tests:
    name: 1. Build & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MiniERP.Api.csproj

      - name: Build with Warnings as Errors
        run: dotnet build src/MiniERP.Api.csproj -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Run Unit & Contract Tests
        run: dotnet test tests/MiniERP.Api.Tests/MiniERP.Api.Tests.csproj -c Release --filter "Category!=Integration" --logger "trx;LogFileName=unit-tests.trx"

  full-acceptance-pipeline:
    name: 2. Full Acceptance Pipeline (Docker + Oracle + Integration Tests)
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Make Scripts Executable
        run: chmod +x scripts/*.sh

      - name: Run Full Acceptance Pipeline (7 Stages)
        run: bash scripts/run-all-tests.sh

      - name: Archive Test & Execution Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-artifacts
          path: artifacts/
          retention-days: 7
