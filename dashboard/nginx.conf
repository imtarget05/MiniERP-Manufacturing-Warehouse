# MiniERP dashboard — Nginx front door.
#
# Two jobs, and nothing else:
#   1. serve the static dashboard from the image webroot;
#   2. reverse-proxy /api/ to the API container so the browser only ever
#      talks to one origin (no CORS, no credential in a URL).
#
# Every path Nginx writes to is under /tmp, because the container may run as a
# non-root user and the image filesystem is not writable by anyone but root.
worker_processes  auto;
error_log         /dev/stderr warn;
pid               /tmp/nginx.pid;

events {
  worker_connections  1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # --- non-root-safe scratch space -----------------------------------------
  client_body_temp_path /tmp/nginx-client-body;
  proxy_temp_path       /tmp/nginx-proxy;
  fastcgi_temp_path     /tmp/nginx-fastcgi;
  uwsgi_temp_path       /tmp/nginx-uwsgi;
  scgi_temp_path        /tmp/nginx-scgi;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  log_format main '$remote_addr "$request" $status $body_bytes_sent';
  access_log /dev/stdout main;

  upstream minierp_api {
    server api:5000;
  }

  server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    gzip              on;
    gzip_types        text/plain text/css application/javascript application/json;
    gzip_min_length   1024;

    # Runtime config must never be cached: it is the operator's handle on the
    # API origin, and a stale copy silently points the UI at the wrong host.
    location = /runtime-config.js {
      add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
      add_header Pragma        "no-cache" always;
      expires    -1;
      try_files  /runtime-config.js =404;
    }

    location /api/ {
      proxy_pass         http://minierp_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_connect_timeout 10s;
      proxy_read_timeout    60s;
    }

    location = /healthz {
      access_log off;
      return 200 "ok\n";
      add_header Content-Type text/plain;
    }

    location / {
      add_header Cache-Control "no-cache" always;
      try_files $uri $uri/ /index.html;
    }
  }
}
